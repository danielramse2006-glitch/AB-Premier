<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AB Premiere | Kiosco</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="stylesheet" href="assets/rewards.css">
</head>
<body class="socios kiosk">
  <main class="kiosk-screen">
    <section class="kiosk-brand" aria-label="Bienvenida AB Premiere">
      <img class="kiosk-logo" src="assets/logo-ab-premiere.png" alt="AB Premiere">
      <p class="kiosk-overline">Bienvenido a</p>
      <h1>AB Premiere</h1>
      <p class="kiosk-subtitle">Donde el estilo y la elegancia se encuentran</p>
      <p class="kiosk-script">Familia AB</p>
      <div class="kiosk-points">
        <span>Estilo Premium</span>
        <span>Barberos Expertos</span>
        <span>Tus Beneficios Te Esperan</span>
      </div>
    </section>

    <section class="kiosk-panel" id="portalContent" aria-label="Registro de visita">
      <div class="kiosk-clock" id="matamorosClock"></div>
      <div id="connection" class="kiosk-status" role="status">Conectando...</div>
      <div id="lookupMessage" class="kiosk-message" role="status"></div>
      <div class="kiosk-tabs">
        <button type="button" class="active" id="visitModeButton" onclick="showKioskMode('visit')">Registrar visita</button>
        <button type="button" id="registerModeButton" onclick="showKioskMode('register')">Registrar socio</button>
      </div>

      <div id="visitStep">
      <div id="nipStep">
        <p class="kiosk-panel-title">Ingresa tu NIP</p>
        <p class="kiosk-panel-subtitle">Para registrar tu visita</p>
        <form id="lookupForm" class="kiosk-form">
          <input id="code" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" autocomplete="off" aria-label="NIP de 4 digitos" required>
          <div class="pin-dots" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
          </div>
          <div class="keypad">
            <button type="button" data-key="1">1</button>
            <button type="button" data-key="2">2</button>
            <button type="button" data-key="3">3</button>
            <button type="button" data-key="4">4</button>
            <button type="button" data-key="5">5</button>
            <button type="button" data-key="6">6</button>
            <button type="button" data-key="7">7</button>
            <button type="button" data-key="8">8</button>
            <button type="button" data-key="9">9</button>
            <button type="button" data-key="back" aria-label="Borrar">⌫</button>
            <button type="button" data-key="0">0</button>
            <button type="submit" class="confirm-key" aria-label="Aceptar">✓</button>
          </div>
        </form>
      </div>

      <div id="clientArea" class="hidden">
        <div id="clientCard"></div>
        <div class="kiosk-selects">
          <div>
            <label>Barbero</label>
            <select id="barber"></select>
          </div>
          <div>
            <label>Corte o servicio</label>
            <select id="service"></select>
          </div>
        </div>
        <button class="kiosk-register" id="registerVisitButton" onclick="registerVisit()">Registrar visita</button>
        <button class="kiosk-back" onclick="resetKiosk()">Cambiar NIP</button>
      </div>
      </div>

      <div id="registerStep" class="hidden">
        <p class="kiosk-panel-title">Registrar socio</p>
        <p class="kiosk-panel-subtitle">Alta Familia AB</p>
        <div class="kiosk-camera"><video id="video" autoplay playsinline></video></div>
        <p class="camera-actions"><button type="button" onclick="startCamera()">Encender camara</button><button type="button" onclick="capture()">Tomar foto</button></p>
        <canvas id="canvas" hidden></canvas>
        <form id="registerForm" class="kiosk-register-form">
          <label>Nombre completo</label>
          <input id="fullName" required>
          <label>Fecha de nacimiento</label>
          <input id="birthDate" type="date">
          <label>Telefono</label>
          <input id="phone">
          <button class="kiosk-register" type="submit">Crear socio</button>
        </form>
        <div id="registerMessage" class="kiosk-message" role="status"></div>
      </div>
    </section>

    <p class="kiosk-tagline">Tu estilo, tu experiencia, tus beneficios.</p>
    <a class="admin-access" href="admin.html?view=clients">Administracion</a>
  </main>
  <script type="module" src="/src/portal.js"></script>
</body>
</html>
