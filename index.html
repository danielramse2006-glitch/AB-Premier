<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AB Premiere | Socios</title><link rel="stylesheet" href="assets/style.css"></head><body><header><div class="brand"><img src="assets/logo-ab-premiere.png">AB PREMIERE</div><a href="admin.html">Administración →</a></header><main class="wrap"><section class="hero"><img src="assets/logo-ab-premiere.png"><h1>Control de Visitas <span style="color:var(--gold2)">Familia AB</span></h1><p>Consulta tus beneficios, selecciona tu barbero y registra tu servicio.</p></section><div id="connection" class="message" role="status">Conectando…</div><section class="card portal hidden" id="portalContent"><div class="tabs"><button class="btn active" id="tabLookup" onclick="tab('lookup')">Ingresar código</button><button class="btn alt" id="tabRegister" onclick="tab('register')">Nuevo socio</button></div>
<div id="lookup" class="panel active"><h2>Ingresa tu código de 4 dígitos</h2><form id="lookupForm"><input id="code" maxlength="4" pattern="[0-9]{4}" inputmode="numeric" placeholder="Ej. 2026" required><button class="btn wide" style="margin-top:15px">Consultar mis datos</button></form><div id="lookupMessage"></div><div id="clientArea" class="hidden"><div id="clientCard"></div><div class="grid2"><div><label>Selecciona barbero</label><select id="barber"></select></div><div><label>Selecciona corte o servicio</label><select id="service"></select></div></div><button class="btn wide" style="margin-top:18px" onclick="registerVisit()">Registrar visita</button></div></div>
<div id="register" class="panel"><h2>Registro de nuevo socio</h2><div class="camera"><video id="video" autoplay playsinline></video></div><p style="text-align:center"><button class="btn alt" onclick="startCamera()">Encender cámara</button> <button class="btn" onclick="capture()">Tomar foto</button></p><canvas id="canvas" hidden></canvas><form id="registerForm"><div class="grid2"><div><label>Nombre completo</label><input id="fullName" required></div><div><label>Fecha de nacimiento</label><input id="birthDate" type="date" required></div><div><label>Teléfono</label><input id="phone"></div><div class="muted">El registro será autorizado con la sesión del encargado.</div></div><button class="btn wide" style="margin-top:18px">Crear socio</button></form><div id="registerMessage"></div></div></section></main><footer>AB PREMIERE · Reynosa, Tamaulipas</footer>
<script type="module" src="/src/portal.js"></script></body></html>
